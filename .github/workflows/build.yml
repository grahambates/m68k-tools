name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check generated rule documentation
        run: |
          pnpm --filter m68k-lint exec node scripts/generate-rules-doc.mjs
          git diff --exit-code -- packages/m68k-lint/docs/rules.md packages/m68k-lint/docs/rule-examples.md
      - run: pnpm run check:packages
      - run: pnpm package
